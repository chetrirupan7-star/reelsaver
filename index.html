
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelSaver - Video Downloader</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #f7f3fa;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  color: #28202d;
}
main {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 26px;
  border-radius: 20px;
  box-shadow: 0 8px 30px #0001;
}
h1 { text-align: center; color: #d62976; }
p { color: #665d6b; line-height: 1.5; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 16px;
}
input { border: 1px solid #ddd; }
button {
  background: #d62976;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}
#status { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>📱 ReelSaver</h1>
  <p>Paste a direct video file link below to download a video you own or are authorized to save.</p>

  <form id="form">
    <input id="url" type="url"
      placeholder="https://example.com/video.mp4" required>
    <button type="submit">Download Video</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <p>Only download videos you own or have permission to save.</p>
</main>

<script>
const form = document.getElementById("form");
const input = document.getElementById("url");
const status = document.getElementById("status");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  let videoUrl;

  try {
    videoUrl = new URL(input.value.trim());

    if (videoUrl.protocol !== "https:") {
      throw new Error("Please use a secure HTTPS video link.");
    }

    if (!/\.(mp4|webm|mov)$/i.test(videoUrl.pathname)) {
      throw new Error(
        "Please enter a direct MP4, WebM, or MOV video file link."
      );
    }
  } catch (error) {
    status.textContent = error.message || "Please enter a valid video link.";
    return;
  }

  status.textContent = "Opening video link...";

  const link = document.createElement("a");
  link.href = videoUrl.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.download = "";
  document.body.appendChild(link);
  link.click();
  link.remove();

  status.textContent =
    "Video link opened. The website hosting the video may control whether it downloads or plays in your browser.";
});
</script>
</body>
</html>
